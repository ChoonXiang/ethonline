name: ethonline-demo

services:
  primary:
    image: ethonline-demo-api:local
    build:
      context: ../..
      dockerfile: infra/demo/Dockerfile
    ports:
      - "127.0.0.1:4001:4001"
    restart: "no"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4001/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 3
    stop_grace_period: 10s
